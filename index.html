<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFAD – Uluslararası İnsani Yardımlar · Sinematik Sunum Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --red:#C8102E; --navy:#1B2A4A; --navy2:#0f182b; --cream:#F5F3EE;
  --muted:#9A9590; --border:rgba(15,13,11,0.1); --shadow:0 4px 24px rgba(15,13,11,0.14);
  --gold:#ffd166;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;background:var(--navy2);color:#0F0D0B}
.app{display:flex;height:100vh;width:100vw}
.main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}

/* ───────── NORMAL MOD: ÜST BAR ───────── */
.topbar{position:absolute;top:14px;left:14px;right:14px;z-index:1000;background:rgba(255,255,255,.96);
  padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;border-left:5px solid var(--red)}
.brand h1{font-family:'Bebas Neue',sans-serif;font-size:27px;color:var(--navy);letter-spacing:1px;line-height:1}
.brand h1 span{color:var(--red)}
.brand p{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;margin-top:2px}
.topstats{display:flex;gap:22px;flex-wrap:wrap}
.ts{text-align:center}
.ts-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--red);line-height:1}
.ts-lbl{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

#map{flex:1;width:100%;z-index:1;background:#0b1220}
.leaflet-top.leaflet-right{margin-top:86px;margin-right:4px}
.leaflet-control-layers{border:none!important;border-radius:8px!important;box-shadow:var(--shadow)!important;font-family:'IBM Plex Sans',sans-serif;font-size:12px}
.leaflet-bar{border:none!important;box-shadow:var(--shadow)!important;border-radius:8px!important;overflow:hidden}

/* ───────── ALT BAR ───────── */
.bottom-bar{position:absolute;bottom:14px;left:14px;right:14px;z-index:1000;background:rgba(255,255,255,.96);
  padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.top-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.filters{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.filter-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:11px;
  font-family:'IBM Plex Mono',monospace;color:#4a4540;cursor:pointer;transition:.18s}
.filter-btn:hover{border-color:var(--navy);color:var(--navy)}
.filter-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.studio-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st-btn{padding:7px 13px;border-radius:6px;border:none;font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.2s}
.st-play{background:#eef2f7;color:var(--navy);border:1px solid rgba(27,42,74,.2)}
.st-play:hover{background:#dde5f0}
.st-all{background:var(--red);color:#fff}
.st-all:hover{background:#a50c25}
.st-rec{background:var(--navy);color:#fff}
.st-rec:hover{background:#293f6e}
.speed-sel{padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:11px;background:#fff;color:var(--navy)}
.year-chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.y-chip{flex:1;min-width:44px;text-align:center;padding:5px 4px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  background:#f2efe9;border:1px solid var(--border);border-radius:5px;cursor:pointer;color:#4a4540;transition:.18s}
.y-chip:hover{border-color:var(--navy);color:var(--navy);background:#fff}
.y-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}

/* ───────── YAN PANEL ───────── */
.side-panel{width:380px;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:1001}
.sp-head{background:var(--navy);padding:18px 20px;flex-shrink:0}
.sp-head h2{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#fff;letter-spacing:.04em}
.sp-head p{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;font-family:'IBM Plex Mono',monospace}
.sp-body{overflow-y:auto;flex:1}
.chart-wrap{padding:16px 16px 0;position:relative;height:215px}
.ev-head{padding:12px 16px 6px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)}
.ev-head h3{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--navy);letter-spacing:.04em}
.ev-count{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted)}
.ev-list{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.ev-card{padding:11px 14px;border:1px solid var(--border);border-radius:6px;background:var(--cream);border-left:3px solid var(--red);cursor:pointer;transition:.2s}
.ev-card:hover,.ev-card.active{background:#fff3f5;border-left-width:6px;border-left-color:var(--navy)}
.ev-title{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--navy)}
.ev-desc{font-size:11px;color:#5a5550;line-height:1.5}
.ev-tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-family:'IBM Plex Mono',monospace;margin-top:6px}
.ev-empty{padding:20px 16px;font-size:12px;color:var(--muted);font-style:italic}

/* ───────── DETAY MODALI ───────── */
.detail-modal{position:fixed;inset:0;z-index:2000;background:rgba(15,13,11,.5);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.detail-modal.open{opacity:1;pointer-events:all}
.dm-box{background:#fff;width:min(560px,92vw);max-height:80vh;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.dm-head{background:var(--navy);padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start}
.dm-head-info h3{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:.04em}
.dm-head-info p{font-size:11px;color:rgba(255,255,255,.5);font-family:'IBM Plex Mono',monospace;margin-top:3px}
.dm-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer}
.dm-body{overflow-y:auto;padding:16px 20px}
.dm-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.dm-tag{font-size:10px;font-family:'IBM Plex Mono',monospace;padding:3px 9px;border-radius:3px;border:1px solid}
.dm-entry{padding:10px 0;border-bottom:1px solid rgba(15,13,11,.06)}
.dm-entry:last-child{border-bottom:none}
.dm-year{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--red);letter-spacing:.06em;margin-bottom:3px}
.dm-text{font-size:12px;color:#3a3530;line-height:1.6}
.dm-amount{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:4px}
.leaflet-popup-content-wrapper{border-radius:8px;padding:0;overflow:hidden;box-shadow:var(--shadow)}
.leaflet-popup-content{margin:0}
.cpop{padding:13px 16px}
.cpop h4{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--red);margin-bottom:4px}
.cpop p{font-size:11px;color:#3a3530;margin-bottom:3px;line-height:1.4}
.cpop-btn{display:inline-block;margin-top:8px;padding:5px 12px;background:var(--navy);color:#fff;font-size:11px;font-family:'IBM Plex Mono',monospace;border-radius:4px;cursor:pointer;border:none}
.tc-deprem{background:#F2D0D6;color:#8B0B1F;border-color:#C8102E}
.tc-sel{background:#D0EBEE;color:#0E6B74;border-color:#0E6B74}
.tc-catisma{background:#F5E9CC;color:#7A5010;border-color:#C9962A}
.tc-saglik{background:#D8E8F5;color:#1A4A7A;border-color:#2A6AAD}
.tc-gida{background:#D0EAD9;color:#1A6B3A;border-color:#1A6B3A}
.tc-yangin{background:#FFE8DC;color:#8B3010;border-color:#D05020}
.tc-diger{background:#E9E1F7;color:#4A2E8A;border-color:#7B5CC8}

/* ═══════════════════════════════════════════════════════
   SİNEMATİK MOD (KAYIT İÇİN TEMİZ EKRAN)
═══════════════════════════════════════════════════════ */
body.cine .topbar, body.cine .bottom-bar, body.cine .side-panel, body.cine .leaflet-control-container{display:none!important}
#cine{position:absolute;inset:0;z-index:1300;pointer-events:none;opacity:0;transition:opacity .5s}
body.cine #cine{opacity:1}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(5,9,18,.55) 100%)}

/* HUD: sol üstte büyük yıl, sağ üstte zaman çizgisi */
.ch-left{position:absolute;top:30px;left:40px}
.ch-brand{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.28em;color:#fff;background:var(--red);display:inline-block;padding:6px 14px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.ch-year{font-family:'Bebas Neue',sans-serif;font-size:150px;line-height:.9;color:#fff;letter-spacing:4px;margin-top:10px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.ch-year.tick{animation:yearTick .7s cubic-bezier(.2,.9,.25,1.2)}
@keyframes yearTick{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
.ch-count{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.2em;color:var(--gold);margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.ch-timeline{position:absolute;top:34px;right:40px;display:flex;gap:5px;background:rgba(11,18,32,.72);padding:9px 12px;border-radius:40px;border:1px solid rgba(255,255,255,.12)}
.tl-y{font-family:'IBM Plex Mono',monospace;font-size:13px;color:rgba(255,255,255,.45);padding:5px 8px;border-radius:20px;transition:all .45s}
.tl-y.done{color:rgba(255,255,255,.85)}
.tl-y.now{background:var(--red);color:#fff;font-weight:600;transform:scale(1.18);box-shadow:0 0 18px rgba(200,16,46,.8)}

/* BİLGİ KARTI */
.aid-card{position:absolute;left:40px;bottom:46px;width:min(780px,56vw);background:linear-gradient(160deg,rgba(18,30,56,.96),rgba(10,16,32,.96));
  border:1px solid rgba(255,255,255,.14);border-left:8px solid var(--red);border-radius:18px;padding:26px 32px 28px;color:#fff;
  box-shadow:0 24px 60px rgba(0,0,0,.55);transform:translateX(-120%);opacity:0;transition:transform .75s cubic-bezier(.16,1,.3,1),opacity .4s}
.aid-card.show{transform:none;opacity:1}
.aid-card.out{transform:translateX(-30px);opacity:0;transition:transform .35s ease-in,opacity .3s}
.ac-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ac-tag{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:30px;color:#0b1220;font-weight:600}
.ac-route{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.14em;color:rgba(255,255,255,.7)}
.ac-name{font-family:'Bebas Neue',sans-serif;font-size:84px;line-height:1;letter-spacing:3px;margin-top:10px}
.ac-metric{display:flex;align-items:baseline;gap:14px;margin-top:6px;min-height:16px}
.ac-metric b{font-family:'Bebas Neue',sans-serif;font-size:76px;font-weight:400;color:var(--gold);line-height:1;letter-spacing:2px}
.ac-metric span{font-size:28px;font-weight:500;color:#fff}
.ac-metric.cash span{font-size:30px;color:var(--gold);letter-spacing:.04em}
.ac-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:9px;font-size:21px;font-weight:500;padding:9px 18px;border-radius:40px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);opacity:0;transform:scale(.6) translateY(10px)}
.aid-card.show .chip{animation:chipPop .5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes chipPop{to{opacity:1;transform:none}}
.chip i{font-style:normal;font-size:26px}
.ac-desc{font-size:25px;line-height:1.5;color:rgba(255,255,255,.92);margin-top:18px;font-weight:300;opacity:0;transform:translateY(8px);transition:all .6s .7s}
.aid-card.show .ac-desc{opacity:1;transform:none}

/* HARİTA ÜZERİ ÖĞELER */
.dest-label{position:absolute;transform:translate(-50%,-44px);white-space:nowrap;font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:3px;color:#fff;
  text-shadow:0 0 6px #000,0 2px 14px #000;animation:labelIn .6s ease both}
@keyframes labelIn{from{opacity:0;transform:translate(-50%,-30px)}to{opacity:1;transform:translate(-50%,-44px)}}
.tr-label{position:absolute;transform:translate(-50%,-40px);white-space:nowrap;font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;color:#ff8da0;text-shadow:0 0 6px #000,0 2px 12px #000}
.ripple{position:absolute;left:-30px;top:-30px;width:60px;height:60px}
.ripple span{position:absolute;inset:0;border-radius:50%;border:3px solid var(--rc);animation:rip 2.2s ease-out infinite;opacity:0}
.ripple span:nth-child(2){animation-delay:.7s}.ripple span:nth-child(3){animation-delay:1.4s}
@keyframes rip{0%{transform:scale(.15);opacity:.95}100%{transform:scale(1.6);opacity:0}}
.ripple i{position:absolute;left:21px;top:21px;width:18px;height:18px;border-radius:50%;background:var(--rc);border:3px solid #fff;box-shadow:0 0 18px var(--rc)}
.trdot{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--red);border:4px solid #fff;box-shadow:0 0 0 6px rgba(200,16,46,.35),0 0 26px rgba(200,16,46,.9);animation:trp 1.8s infinite}
@keyframes trp{50%{box-shadow:0 0 0 14px rgba(200,16,46,.1),0 0 26px rgba(200,16,46,.9)}}
.veh{position:absolute;left:-26px;top:-26px;width:52px;height:52px}
.veh svg{width:52px;height:52px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))}

/* YIL GEÇİŞ EKRANI */
.year-intro{position:absolute;inset:0;z-index:1500;pointer-events:none;overflow:hidden;visibility:hidden}
.year-intro.on{visibility:visible}
.yi-wipe{position:absolute;inset:0;transform:translateX(-101%);transition:transform .8s cubic-bezier(.77,0,.18,1)}
.yi-wipe.a{background:var(--red)}
.yi-wipe.b{background:linear-gradient(135deg,#1B2A4A,#0b1220)}
.year-intro.in .yi-wipe{transform:none}
.year-intro.in .yi-wipe.b{transition-delay:.14s}
.year-intro.out .yi-wipe{transform:translateX(101%)}
.year-intro.out .yi-wipe.b{transition-delay:0s}.year-intro.out .yi-wipe.a{transition-delay:.14s}
.yi-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;opacity:0;transition:opacity .5s;text-align:center;padding:0 80px}
.yi-inner.show{opacity:1}
.yi-badge{font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.3em;text-transform:uppercase;background:var(--red);padding:8px 20px;border-radius:30px}
.yi-year{font-family:'Bebas Neue',sans-serif;font-size:230px;line-height:.95;letter-spacing:8px;margin-top:14px;display:flex}
.yi-year span{display:inline-block;opacity:0;transform:translateY(80px) rotateX(-70deg)}
.yi-inner.show .yi-year span{animation:digitIn .9s cubic-bezier(.2,.9,.25,1.1) forwards}
@keyframes digitIn{to{opacity:1;transform:none}}
.yi-sub{font-size:30px;font-weight:300;color:rgba(255,255,255,.88);margin-top:6px}
.yi-countries{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1500px;margin-top:30px}
.yi-c{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;padding:4px 20px;border:2px solid rgba(255,255,255,.35);border-radius:40px;opacity:0;transform:scale(.7)}
.yi-inner.show .yi-c{animation:chipPop .5s cubic-bezier(.2,1.3,.4,1) forwards}
.yi-stats{display:flex;gap:70px;margin-top:38px;padding-top:26px;border-top:1px solid rgba(255,255,255,.25)}
.yi-st b{font-family:'Bebas Neue',sans-serif;font-size:78px;color:#ff6b81;display:block;line-height:1;font-weight:400}
.yi-st span{font-family:'IBM Plex Mono',monospace;font-size:15px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.14em}

/* KAYIT ROZETİ */
.rec-pill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:2500;background:rgba(200,16,46,.95);color:#fff;padding:7px 16px;border-radius:30px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;display:none;align-items:center;gap:8px}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.stop-floating{position:fixed;bottom:10px;right:10px;z-index:2600;background:rgba(27,42,74,.85);color:#fff;border:1px solid rgba(255,255,255,.25);
  padding:6px 12px;border-radius:30px;font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;display:none;opacity:.35}
.stop-floating:hover{opacity:1}
body.cine .stop-floating{display:inline-flex}

/* ── v2 eklemeleri ── */
.tb-tools{display:flex;gap:6px;align-items:center}
.tool-btn{padding:6px 11px;border-radius:20px;border:1px solid var(--border);background:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--navy);cursor:pointer}
.tool-btn:hover{background:#eef2f7}.tool-btn.on{background:var(--navy);color:#fff}
.lang-sw{display:inline-flex;border:1px solid var(--border);border-radius:20px;overflow:hidden}
.lang-sw button{padding:6px 11px;border:none;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;color:var(--navy)}
.lang-sw button.on{background:var(--red);color:#fff}
.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar-lbl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.08em;min-width:84px}
.country-sel{padding:6px 8px;border-radius:6px;border:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:11px;background:#fff;color:var(--navy);max-width:200px}
.st-net{background:#0E6B74;color:#fff}.st-net:hover{background:#0a5159}
.st-ctry{background:#7B5CC8;color:#fff}.st-ctry:hover{background:#6446ad}
.flag{height:52px;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.55);margin-right:20px;flex-shrink:0}
.flag-s{height:30px;border-radius:4px;margin-right:12px;box-shadow:0 1px 6px rgba(0,0,0,.5);vertical-align:middle}
.ac-name{display:flex;align-items:center}
.geo-glow{filter:drop-shadow(0 0 9px rgba(255,255,255,.6))}
.ch-cum{margin-top:14px;width:430px;background:rgba(11,18,32,.74);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 16px}
.cc-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.7)}
.cc-bar{height:8px;border-radius:6px;background:rgba(255,255,255,.14);margin:8px 0;overflow:hidden}
.cc-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),#ff8da0);border-radius:6px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.cc-txt{font-family:'IBM Plex Mono',monospace;font-size:16px;color:#fff;letter-spacing:.06em}
.cc-txt b{font-family:'Bebas Neue',sans-serif;font-size:34px;font-weight:400;color:var(--gold);letter-spacing:1px;display:inline-block}
.cc-txt b.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.tl-y.has{color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.ac-totals{display:flex;flex-wrap:wrap;gap:22px;margin-top:10px}
.ac-totals div b{font-family:'Bebas Neue',sans-serif;font-size:56px;font-weight:400;color:var(--gold);line-height:1;display:block}
.ac-totals div span{font-size:20px;color:#fff}
.yi-flag{height:110px;margin-bottom:14px;display:none}
.yi-flag img{height:110px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.yi-year{flex-wrap:wrap;justify-content:center;max-width:1750px}

function metricOf(d){

const SFX = {
  ctx:null, on:false,
  init(){ if(!this.ctx){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return false; this.ctx=new A(); } if(this.ctx.state==='suspended') this.ctx.resume(); return true; },
  env(g,t0,a,d,peak){ g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); },
  whoosh(){
    if(!this.on||!this.init()) return; const c=this.ctx, t0=c.currentTime, dur=1.0;
    const buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate), data=buf.getChannelData(0); for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.4; f.frequency.setValueAtTime(250,t0); f.frequency.exponentialRampToValueAtTime(3200,t0+.55); f.frequency.exponentialRampToValueAtTime(500,t0+dur);
    const g=c.createGain(); this.env(g,t0,.35,.62,.2); src.connect(f); f.connect(g); g.connect(c.destination); src.start(t0); src.stop(t0+dur);
  },
  tick(){
    if(!this.on||!this.init()) return; const c=this.ctx, t0=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type='triangle'; o.frequency.value=1500; this.env(g,t0,.003,.035,.045); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+.06);
  },
  ping(){
    if(!this.on||!this.init()) return; const c=this.ctx, t0=c.currentTime;
    [[960,.16],[1440,.06]].forEach(([fr,pk])=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(fr,t0); this.env(g,t0,.01,1.1,pk); o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+1.2); });
  }
};

class Abort extends Error {}
const sleep = ms => new Promise((res,rej)=>{
  let left=ms/S.speed; const step=80;
  (function tick(){ if(S.abort) return rej(new Abort()); if(left<=0) return res(); const w=Math.min(step,left); left-=w; setTimeout(tick,w); })();
});
const ease = p => p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2;
function animate(ms, fn){
  return new Promise((res,rej)=>{
    const t0=performance.now(), dur=ms/S.speed;
    (function f(now){
      try{ if(S.abort) return rej(new Abort()); const p=Math.max(0,Math.min(1,(now-t0)/dur)); fn(p); p<1?requestAnimationFrame(f):res(); }catch(e){ rej(e); }
    })(t0);
  });
}
function countTo(el, to, ms, sound=true){
  const int=Number.isInteger(to); let last=0;
  return animate(ms,p=>{ const v=to*ease(p); el.textContent=fmt(int?Math.round(v):Math.round(v*10)/10);
    const now=performance.now(); if(sound && p<1 && now-last>75){ SFX.tick(); last=now; } }).then(()=>{ el.textContent=fmt(to); });
}

const rippleIcon=c=>L.divIcon({className:'',iconSize:[0,0],html:`<div class="ripple" style="--rc:${c}"><span></span><span></span><span></span><i></i></div>`});
const labelIcon=n=>L.divIcon({className:'',iconSize:[0,0],html:`<div class="dest-label">${up(n)}</div>`});

function bezier(a,b,n=90){
  const dlat=b[0]-a[0], dlng=b[1]-a[1], dist=Math.hypot(dlat,dlng)||1;
  let px=-dlng/dist, py=dlat/dist; if(px<0){ px=-px; py=-py; }
  const k=dist*.22, cx=(a[0]+b[0])/2+px*k, cy=(a[1]+b[1])/2+py*k, pts=[];
  for(let i=0;i<=n;i++){ const tt=i/n,u=1-tt; pts.push([u*u*a[0]+2*u*tt*cx+tt*tt*b[0], u*u*a[1]+2*u*tt*cy+tt*tt*b[1]]); }
  return pts;
}

/* ülke sınırı parlatma (GeoJSON) */
function glowCountry(c, col, opacity=.32){
  const info=CINFO[c]; const g=info && GEO[info[2]]; if(!g) return null;

  animate(1000,p=>lyr.setStyle({fillOpacity:opacity*ease(p)})).catch(()=>{});
  return lyr;
}

/* tek operasyon  (opt.mode: 'year' | 'country', opt.first) */
async function playOp(d, idx, n, prev, opt={}){
  const country=opt.mode==='country', first=!!opt.first;
  await hideCard();
  const col=getColor(d.t), dest=[d.lat,d.lng], mode=transportOf(d);
  prev.forEach(p=>{ p.trail.setStyle({weight:2.5,opacity:.4}); if(p.ghost&&!country) p.ghost.setStyle({opacity:.12}); if(p.geo&&!country) p.geo.setStyle({fillOpacity:.1,weight:1.2}); });

  if(country && !first){
    if(opt.rip) cineLayer.removeLayer(opt.rip); if(opt.geo) cineLayer.removeLayer(opt.geo);
    opt.rip=L.marker(dest,{icon:rippleIcon(col),interactive:false,zIndexOffset:800}).addTo(cineLayer);
    opt.geo=glowCountry(d.c,col,.34);
    SFX.whoosh(); SFX.ping(); cumAdd(d);
    await sleep(800); await showCard(d); await sleep(3000);
    return;
  }
  if(!country || first){
    map.flyToBounds(L.latLngBounds([TR,dest]),{paddingTopLeft:[90,230],paddingBottomRight:[90,330],maxZoom:5,duration:1.6});
    await sleep(1000);
  }
  const pts=bezier(TR,dest);
  let ghost=opt.ghost;
  if(!ghost){ ghost=L.polyline(pts,{color:col,weight:2,opacity:.3,dashArray:'4 9'}).addTo(cineLayer); opt.ghost=ghost; }
  const trail=L.polyline([pts[0]],{color:col,weight:5,opacity:.95,lineCap:'round'}).addTo(cineLayer);
  const veh=L.marker(pts[0],{icon:vehIcon(mode,col),interactive:false,zIndexOffset:1200}).addTo(cineLayer);
  SFX.whoosh();
  await animate(country&&!first?1500:2500,p=>{
    const i=Math.max(0,Math.min(pts.length-2,Math.floor(ease(p)*(pts.length-1))));
    trail.setLatLngs(pts.slice(0,i+2)); veh.setLatLng(pts[i+1]);
    const a=pts[i], b=pts[i+1], el=veh.getElement()&&veh.getElement().querySelector('.vi');
    if(el){ const ang=Math.atan2(-(b[0]-a[0]),(b[1]-a[1])*Math.cos(a[0]*Math.PI/180))*180/Math.PI;
      el.style.transform = mode==='plane' ? `rotate(${ang}deg)` : (b[1]<a[1] ? 'scaleX(-1)' : 'none'); }
  });
  cineLayer.removeLayer(veh);

  // varış
  if(country && opt.rip) cineLayer.removeLayer(opt.rip);
  if(country && opt.geo) cineLayer.removeLayer(opt.geo);
  const rip=L.marker(dest,{icon:rippleIcon(col),interactive:false,zIndexOffset:800}).addTo(cineLayer);
  const geo=glowCountry(d.c,col);
  let lab=opt.lab; if(!lab){ lab=L.marker(dest,{icon:labelIcon(cn(d.c)),interactive:false,zIndexOffset:1000}).addTo(cineLayer); if(country) opt.lab=lab; }
  opt.rip=rip; opt.geo=geo;
  SFX.ping(); cumAdd(d);
  map.flyTo(dest,zoomFor(d.c),{duration:1.9});
  await sleep(500);
  await showCard(d);
  await sleep(country?3000:3400);
  if(!country) cineLayer.removeLayer(lab);
  prev.push({trail,ghost,rip,geo});
}

const entriesOf = name => DB.filter(d=>d.c===name).sort((a,b)=>a.y-b.y||a.id-b.id);
function totalsOf(es){
  const fam=(u)=> /^ton/.test(u)?'ton' : ['koli','gıda paketi','hijyen koli','hijyen paketi','kit'].includes(u)?'koli' : u==='çadır'?'çadır' : ['bambu ev','konteyner ev','konut','aile barınak'].includes(u)?'barınak' : u==='poliklinik'?'poliklinik' : null;
  const sums={}, cumMax={};
  es.forEach(d=>{ const f=fam(d.u); if(!f||isCash(d)) return; if(/Kümülatif|Toplam/i.test(d.desc)) cumMax[f]=Math.max(cumMax[f]||0,d.amt); else sums[f]=(sums[f]||0)+d.amt; });
  const label={ton:LANG==='en'?'tons':'ton',koli:LANG==='en'?'parcels / packages':'koli / paket',çadır:LANG==='en'?'tents':'çadır',barınak:LANG==='en'?'shelters / homes':'barınak / konut',poliklinik:LANG==='en'?'clinic visits':'poliklinik'};
  return Object.keys({...sums,...cumMax}).map(f=>({n:Math.max(sums[f]||0,cumMax[f]||0),u:label[f]}));
}

/* ═════════ 7. KAYIT (performans için optimize edilmiş) ═════════
   • Codec önceliği: H.264/MP4 (donanım kodlayıcı) → VP8 → VP9 (yazılım kodlaması, en ağırı)
   • 1080p / 30 fps sınırı + 5 Mbps  (eski: sınırsız çözünürlük + VP9 + 8 Mbps)
   • rec.start(1000): veri her saniye parça parça alınır (kapanışta tek büyük yığılma olmaz)
   • Kayıt sırasında ağır CSS efektleri kapanır (body.rec-perf), ısınma beklemesi ve içerik ipucu eklenir */
const REC_PROFILES = {
  auto:{ cands:[['video/mp4;codecs=avc1.640028','mp4',5e6],['video/mp4;codecs=avc1.4d0028','mp4',5e6],['video/mp4;codecs=avc1','mp4',5e6],
                ['video/webm;codecs=h264','webm',5e6],['video/webm;codecs=vp8','webm',5e6],['video/webm;codecs=vp9','webm',5e6]] },
  vp8: { cands:[['video/webm;codecs=vp8','webm',5e6],['video/webm;codecs=vp9','webm',5e6]] },
  vp9: { cands:[['video/webm;codecs=vp9','webm',6e6],['video/webm;codecs=vp8','webm',5e6]] }
};
function pickRecorder(profile){
  for(const [mime,ext,bps] of (REC_PROFILES[profile]||REC_PROFILES.auto).cands){ if(MediaRecorder.isTypeSupported(mime)) return {mime,ext,bps}; }
  return {mime:'',ext:'webm',bps:5e6};
}
let screenStream=null;
async function getCaptureStream(){
  if(screenStream && screenStream.active) return screenStream;
  alert(t('recAlert'));
  const video = { width:{ideal:1920,max:1920}, height:{ideal:1080,max:1080}, frameRate:{ideal:30,max:30}, displaySurface:'browser' };
  try{ screenStream = await navigator.mediaDevices.getDisplayMedia({video, audio:SFX.on, preferCurrentTab:true, selfBrowserSurface:'include'}); }
  catch(e){ if(e && e.name==='NotAllowedError') throw e;
            screenStream = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30}, audio:SFX.on}); }   // eski tarayıcı yedeği
  const vt = screenStream.getVideoTracks()[0];
  try{ vt.contentHint='motion'; }catch(e){}                       // kodlayıcıya "akıcılık önemli" ipucu
  vt.addEventListener('ended',()=>stopTour());                    // paylaşım durdurulursa anlatımı da durdur
  return screenStream;
}
const wait = ms => new Promise(r=>setTimeout(r,ms));
const slug = s => String(s).replace(/[çÇ]/g,'c').replace(/[ğĞ]/g,'g').replace(/[ıİ]/g,'i').replace(/[öÖ]/g,'o').replace(/[şŞ]/g,'s').replace(/[üÜ]/g,'u').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');
/* playFn: kaydı yapılacak oynatma  ·  fileBase: dosya adı gövdesi  ·  pillText: ekrandaki kayıt etiketi */
async function recordSession(playFn, fileBase, pillText){
  const prof = pickRecorder(document.getElementById('recFmt').value);
  let rec=null; const chunks=[];
  try{
    const stream = await getCaptureStream();
    document.getElementById('recPill').style.display='inline-flex';
    document.getElementById('recStatusText').textContent=t('recText')+pillText;
    const opts={videoBitsPerSecond:prof.bps}; if(prof.mime) opts.mimeType=prof.mime; if(stream.getAudioTracks().length) opts.audioBitsPerSecond=128000;
    rec = new MediaRecorder(stream, opts);
    rec.ondataavailable = e => { if(e.data && e.data.size>0) chunks.push(e.data); };
    const done = new Promise(res=>{ rec.onstop = res; rec.onerror = res; });
    document.body.classList.add('rec-perf');                      // ağır efektleri kapat
    rec.start(1000);                                              // 1 sn'lik parçalar
    await wait(900);                                              // kodlayıcı ısınsın
    await playFn();
    await wait(700);                                              // son kare kesilmesin
    if(rec.state!=='inactive') rec.stop();
    await done;
    if(chunks.length){
      const type = (prof.mime||'video/webm').split(';')[0];
      const url = URL.createObjectURL(new Blob(chunks,{type}));
      const a=document.createElement('a'); a.href=url; a.download=`${fileBase}.${prof.ext}`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
    }
  }catch(e){ console.error('Kayıt iptal:',e); try{ if(rec && rec.state!=='inactive') rec.stop(); }catch(_){} }
  finally{
    document.body.classList.remove('rec-perf'); document.getElementById('recPill').style.display='none';
    if(screenStream){ screenStream.getTracks().forEach(x=>x.stop()); screenStream=null; }
  }
}
function recordOneYearVideo(){ const y=S.year; return recordSession(()=>playCinematicYear(y), `AFAD_${y}_Uluslararasi_Yardimlar`, y); }
function recordCountryVideo(){
  const s=selectedCountry(); if(!s) return Promise.resolve();
  const span = s.year==='all' ? '2010-2026' : s.year;
  return recordSession(()=>playCountry(s.name, s.year), `AFAD_${slug(s.name)}_${span}_Uluslararasi_Yardimlar`, `${cn(s.name)} · ${span}`);
}

/* ═════════ 8. ÜLKE DETAYI ═════════ */
function openDetail(country){
  const es=entriesOf(country); if(!es.length) return;
  document.getElementById('dmTitle').textContent=cn(country);
  const types=[...new Set(es.map(d=>d.t))];
  document.getElementById('dmSub').textContent=t('detailSub')(es[0].y,es[es.length-1].y,es.length);
  document.getElementById('dmBody').innerHTML=`<div class="dm-tags">${types.map(x=>`<span class="dm-tag tc-${x}">${catName(x)}</span>`).join('')}</div>`+
    es.map(d=>{ const mt=metricText(d); return `<div class="dm-entry"><div class="dm-year">${d.y} — ${catName(d.t)}</div><div class="dm-text">${d.desc}</div>${mt?`<div class="dm-amount">📦 ${mt}</div>`:''}</div>`; }).join('');
  document.getElementById('detailModal').classList.add('open');
}
function closeDetail(){ document.getElementById('detailModal').classList.remove('open'); }
document.getElementById('detailModal').addEventListener('click',e=>{ if(e.target.id==='detailModal') closeDetail(); });

initChart(); applyLang(); render();
